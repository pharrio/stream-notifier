services:
  stream-notifier:
    image: ghcr.io/pharrio/stream-notifier:latest
    restart: unless-stopped
    environment:
      DISCORD_TOKEN: "REPLACE_WITH_BOT_TOKEN"
      CHANNEL_IDS: "REPLACE_WITH_CHANNEL_ID"
      BROADCAST_BOX_PUBLIC_URL: "https://stream.example.com"
      # LANGUAGE: "zh-CN"                 # Default: en
      # CHECK_INTERVAL_SECONDS: "10"      # Default: 10
      # LOG_CHANNEL_ID: "123456789012345678"
      # BROADCAST_BOX_API_URL: "http://broadcast-box:8080"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
